<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CIT Campus Portal — Academic Timetable & Venue Services</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #fbf6ee; /* Light warm cream/yellow canvas */
      --card-bg: #ffffff;
      --border: #e8e0d5;
      --border-dark: #d5cbbe;
      --text-main: #1c1917;
      --text-muted: #645e57;
      --primary: #600f1c; /* CIT Maroon */
      --primary-hover: #4a0b15;
      --primary-light: #fdf2f2;
      --yellow-light: #fef9ed; /* Light warm yellow */
      --yellow-badge: #fef3c7; /* Light gold/yellow */
      --yellow-border: #fde68a;
      --gold-dark: #92400e;
      --green: #15803d;
      --green-bg: #f0fdf4;
      --red: #b91c1c;
      --red-bg: #fef2f2;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, Menlo, Consolas, monospace;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    .mono {
      font-family: var(--font-mono);
    }

    /* Top University Header */
    header {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      height: 56px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 1px 3px rgba(96, 15, 28, 0.04);
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      background: var(--primary);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.5px;
    }

    .brand-name {
      font-weight: 800;
      font-size: 15px;
      color: var(--primary);
      letter-spacing: -0.2px;
    }

    .user-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Navigation Tabs */
    .user-nav {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-list {
      display: flex;
      gap: 4px;
    }

    .tab-item {
      background: transparent;
      border: none;
      padding: 13px 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
      transition: color 0.15s ease;
    }

    .tab-item:hover {
      color: var(--primary);
    }

    .tab-item.active {
      color: var(--primary);
      font-weight: 700;
    }

    .tab-item.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 16px;
      right: 16px;
      height: 3px;
      background: var(--primary);
      border-radius: 2px 2px 0 0;
    }

    /* Main Container */
    main {
      max-width: 1360px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      flex: 1;
    }

    .content-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 22px 24px;
      box-shadow: 0 4px 12px rgba(96, 15, 28, 0.04);
    }

    .card-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 14px;
    }

    .title-text {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.2px;
    }

    .subtitle-text {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Timetable Grid */
    .grid-wrapper {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    table.calendar-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    table.calendar-table th, table.calendar-table td {
      border: 1px solid var(--border);
      padding: 6px;
    }

    table.calendar-table th {
      background: var(--yellow-light);
      color: var(--primary);
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      padding: 9px 4px;
      width: 13.5%;
      letter-spacing: 0.3px;
    }

    table.calendar-table th.time-header {
      width: 85px;
      color: var(--text-muted);
    }

    td.time-cell {
      background: #fdfaf5;
      color: var(--primary);
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      vertical-align: middle;
    }

    td.slot-container {
      height: 66px;
      vertical-align: top;
      background: #ffffff;
      padding: 4px;
    }

    .class-pill {
      background: #fffdfa;
      border: 1px solid #ede3d7;
      border-left: 3px solid var(--primary);
      border-radius: 4px;
      padding: 5px 6px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-size: 11px;
      transition: transform 0.1s ease;
    }

    .class-pill:hover {
      box-shadow: 0 2px 6px rgba(96, 15, 28, 0.08);
    }

    .class-pill.lab {
      background: #fefcf3;
      border-color: #fde68a;
      border-left-color: #d97706;
    }

    .class-pill.tutorial {
      background: #f0fdf4;
      border-color: #bbf7d0;
      border-left-color: #16a34a;
    }

    /* Form Fields */
    .form-input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border-dark);
      border-radius: 5px;
      font-size: 12px;
      outline: none;
      background: #ffffff;
      color: var(--text-main);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary);
    }

    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 9px 14px;
      border-radius: 5px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.15s ease;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
    }

    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--primary);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 600;
      display: none;
      z-index: 100;
      box-shadow: 0 4px 12px rgba(96, 15, 28, 0.25);
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 14px 24px;
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      background: #ffffff;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="brand-wrap">
      <div class="brand-icon mono">CIT</div>
      <div>
        <div class="brand-name">Chilika Institute of Technology</div>
        <div style="font-size: 11px; color: var(--text-muted);">Student & Faculty Academic Portal</div>
      </div>
    </div>

    <div class="user-actions">
      <div id="user-profile-badge" style="display: flex; align-items: center; gap: 10px;">
        <span id="user-display-email" style="font-weight: 600; font-size: 12px; color: var(--text-main);">student@cit.ac.in</span>
        <span id="user-role-tag" class="mono" style="font-size: 10px; background: var(--yellow-badge); color: var(--gold-dark); border: 1px solid var(--yellow-border); padding: 2px 7px; border-radius: 3px; font-weight: 700;">STUDENT</span>
        <span id="user-admin-link" style="display: none;">
          <a href="/admin" style="font-size: 11px; color: var(--primary); text-decoration: none; border: 1px solid var(--yellow-border); background: var(--yellow-light); padding: 3px 8px; border-radius: 4px; font-weight: 700;">Admin Terminal &rarr;</a>
        </span>
        <button onclick="logout()" style="background: transparent; border: 1px solid var(--border); padding: 5px 12px; border-radius: 4px; font-size: 11px; cursor: pointer; color: var(--primary); font-weight: 600;">
          Sign Out
        </button>
      </div>
    </div>
  </header>

  <!-- User Navigation Sub-bar -->
  <nav class="user-nav">
    <div class="nav-list">
      <button class="tab-item active" onclick="switchUserTab('timetable')">My Schedule</button>
      <button class="tab-item" onclick="switchUserTab('bookings')">Spectra Venue Bookings</button>
      <button class="tab-item" onclick="switchUserTab('ai')">AI Booking Assistant</button>
      <button class="tab-item" onclick="switchUserTab('exams')">Midsem Exams</button>
    </div>
  </nav>

  <!-- Main Content Body -->
  <main id="portal-content">
    <!-- Rendered dynamically -->
  </main>

  <footer>
    <span>Chilika Institute of Technology · Student & Faculty Academic Services</span>
    <span class="mono">Engine: cit-public-v1 · Certified 0 Hard Clashes</span>
  </footer>

  <div id="toast"></div>

  <script>
    let DATA = null;
    let SCHED = null;
    let currentUser = null;
    let currentTab = 'timetable';
    let selectedCohort = 'Y1-A';

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.innerText = msg;
      t.style.display = "block";
      setTimeout(() => { t.style.display = "none"; }, 3000);
    }

    function logout() {
      localStorage.removeItem('cit_session');
      window.location.href = '/login';
    }

    function updateAuthUI() {
      if (!currentUser) return;
      const emailEl = document.getElementById("user-display-email");
      const roleEl = document.getElementById("user-role-tag");
      const adminLinkEl = document.getElementById("user-admin-link");

      emailEl.innerText = `${currentUser.name || currentUser.email} (${currentUser.cohort || ''})`;
      roleEl.innerText = currentUser.role.toUpperCase();

      // Only show Admin Link if user is actually an Administrator
      if (currentUser.role === 'admin') {
        adminLinkEl.style.display = "inline-block";
      } else {
        adminLinkEl.style.display = "none";
      }

      if (currentUser.cohort && (currentUser.cohort.startsWith("Y") || currentUser.cohort.startsWith("CS"))) {
        selectedCohort = currentUser.cohort;
      }
      renderTab();
    }

    function switchUserTab(t) {
      currentTab = t;
      document.querySelectorAll(".tab-item").forEach(item => item.classList.remove("active"));
      event.currentTarget.classList.add("active");
      renderTab();
    }

    function changeCohort(c) {
      selectedCohort = c;
      renderTab();
    }

    async function init() {
      // 1. Session Gatekeeper: Must be logged in to view Portal
      const sessionStr = localStorage.getItem('cit_session');
      if (!sessionStr) {
        window.location.href = '/login';
        return;
      }

      try {
        currentUser = JSON.parse(sessionStr);
      } catch (err) {
        localStorage.removeItem('cit_session');
        window.location.href = '/login';
        return;
      }

      updateAuthUI();

      try {
        const [d, s] = await Promise.all([
          fetch("/api/data").then(r => r.json()),
          fetch("/api/schedule").then(r => r.json())
        ]);
        DATA = d;
        SCHED = s;
        renderTab();
      } catch (e) {
        document.getElementById("portal-content").innerHTML = "<div style='color:red; padding: 24px;'>API error. Ensure server.py is running.</div>";
      }
    }

    function renderTab() {
      const content = document.getElementById("portal-content");
      if (!DATA || !SCHED) return;

      if (currentTab === 'timetable') renderTimetable(content);
      else if (currentTab === 'bookings') renderBookings(content);
      else if (currentTab === 'ai') renderAI(content);
      else if (currentTab === 'exams') renderExams(content);
    }

    // 1. MY SCHEDULE VIEW
    function renderTimetable(content) {
      const sessMap = {};
      DATA.sessions.forEach(s => { sessMap[s.id] = s; });

      const courseMap = {};
      DATA.courses.forEach(c => { courseMap[c.id] = c; });

      const grid = {};
      for (let p = 1; p <= 9; p++) {
        grid[p] = { MON: null, TUE: null, WED: null, THU: null, FRI: null };
      }

      SCHED.sessions.forEach(item => {
        const s = sessMap[item.session_id];
        if (!s) return;
        if (s.groups.includes(selectedCohort)) {
          for (let p = item.start_period; p < item.start_period + s.duration; p++) {
            grid[p][item.day] = { ...s, ...item };
          }
        }
      });

      const periods = [
        { id: 1, label: "08:00 AM", time: "08:00 - 09:00" },
        { id: 2, label: "09:00 AM", time: "09:00 - 10:00" },
        { id: 3, label: "10:00 AM", time: "10:00 - 11:00" },
        { id: 4, label: "11:00 AM", time: "11:00 - 12:00" },
        { id: 5, label: "12:00 PM", time: "12:00 - 01:00" },
        { id: 0, label: "01:00 PM", time: "13:00 - 14:00 (Lunch)" },
        { id: 6, label: "02:00 PM", time: "14:00 - 15:00" },
        { id: 7, label: "03:00 PM", time: "15:00 - 16:00" },
        { id: 8, label: "04:00 PM", time: "16:00 - 17:00" },
        { id: 9, label: "05:00 PM", time: "17:00 - 18:00" }
      ];

      content.innerHTML = `
        <div class="content-card">
          <div class="card-title-row">
            <div>
              <div class="title-text">My Teaching & Class Schedule</div>
              <div class="subtitle-text">Weekly timetable with certified zero clashing (Week 7 active)</div>
            </div>

            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="font-size: 11px; font-weight: 600; color: var(--text-muted);">COHORT:</span>
              <select onchange="changeCohort(this.value)" style="border: 1px solid var(--border-dark); padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; outline: none;">
                ${DATA.student_groups.map(g => `
                  <option value="${g.id}" ${selectedCohort === g.id ? 'selected' : ''}>${g.id} (${g.name})</option>
                `).join('')}
              </select>
            </div>
          </div>

          <div class="grid-wrapper">
            <table class="calendar-table">
              <thead>
                <tr>
                  <th class="time-header">TIME</th>
                  <th>MON</th>
                  <th>TUE</th>
                  <th>WED</th>
                  <th>THU</th>
                  <th>FRI</th>
                  <th>SAT</th>
                  <th>SUN</th>
                </tr>
              </thead>
              <tbody>
                ${periods.map(slot => {
                  if (slot.id === 0) {
                    return `
                      <tr>
                        <td class="time-cell">${slot.label}</td>
                        <td colspan="7" style="background: var(--yellow-badge); border: 1px solid var(--yellow-border); text-align: center; color: var(--gold-dark); font-weight: 700; font-size: 11px; padding: 7px;">
                          LUNCH RECESS (13:00 - 14:00)
                        </td>
                      </tr>
                    `;
                  }

                  return `
                    <tr>
                      <td class="time-cell">${slot.label}</td>
                      ${['MON', 'TUE', 'WED', 'THU', 'FRI'].map(d => {
                        const item = grid[slot.id][d];
                        if (!item) return `<td class="slot-container"></td>`;

                        const cInfo = courseMap[item.course_id];
                        let type = '';
                        if (item.kind === 'lab') type = 'lab';
                        if (item.kind === 'tutorial') type = 'tutorial';

                        return `
                          <td class="slot-container">
                            <div class="class-pill ${type}">
                              <div style="font-weight: 700;">${item.course_id} · ${cInfo ? cInfo.title : ''}</div>
                              <div style="font-size: 10px; color: var(--text-muted);">${item.id}</div>
                              <div style="display: flex; justify-content: space-between; font-size: 10px; color: var(--text-muted); margin-top: 2px;">
                                <span>Room: <strong>${item.room_id}</strong></span>
                                <span>Faculty: ${item.faculty_id}</span>
                              </div>
                            </div>
                          </td>
                        `;
                      }).join('')}
                      <td class="slot-container" style="background: #fafafa;"></td>
                      <td class="slot-container" style="background: #fafafa;"></td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // 2. VENUE BOOKINGS (USER VIEW)
    function renderBookings(content) {
      content.innerHTML = `
        <div class="content-card">
          <div class="card-title-row">
            <div>
              <div class="title-text">Spectra Fest Venue Bookings Status</div>
              <div class="subtitle-text">Official decisions following CIT institutional priority order</div>
            </div>
            <button onclick="switchUserTab('ai')" style="background: var(--primary); color: #fff; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer;">
              + New Venue Request
            </button>
          </div>

          <table class="calendar-table" style="font-size: 12px;">
            <thead>
              <tr style="background: var(--yellow-light);">
                <th style="width: 75px;">REQ ID</th>
                <th>EVENT TITLE</th>
                <th>ORGANIZER</th>
                <th>STATUS</th>
                <th>ALLOCATED VENUE</th>
                <th>DECISION REASON</th>
              </tr>
            </thead>
            <tbody>
              ${SCHED.fest_week.bookings.map(b => {
                const req = DATA.booking_requests.find(r => r.id === b.request_id);
                let color = 'var(--green)';
                let bgBadge = 'var(--green-bg)';
                if (b.status === 'alternative_offered') { color = 'var(--gold-dark)'; bgBadge = 'var(--yellow-badge)'; }
                if (b.status === 'rejected') { color = 'var(--red)'; bgBadge = 'var(--red-bg)'; }

                return `
                  <tr>
                    <td class="mono" style="font-weight: 700; text-align: center; color: var(--primary);">${b.request_id}</td>
                    <td style="font-weight: 600;">${req ? req.title : 'Event'}</td>
                    <td>${req ? req.requester : 'Unknown'}</td>
                    <td style="text-align: center;">
                      <span class="mono" style="font-size: 10px; font-weight: 700; color: ${color}; background: ${bgBadge}; padding: 3px 8px; border-radius: 4px; text-transform: uppercase;">
                        ${b.status.replace('_', ' ')}
                      </span>
                    </td>
                    <td class="mono" style="font-weight: 600;">
                      ${b.status !== 'rejected' ? `${b.room_id} (${b.day} P${b.start_period}-P${b.end_period})` : '—'}
                    </td>
                    <td style="color: var(--text-muted); font-size: 11px;">${b.reason}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    // 3. AI VENUE BOOKING ASSISTANT
    function renderAI(content) {
      content.innerHTML = `
        <div class="content-card" style="max-width: 800px; margin: 0 auto;">
          <div class="card-title-row">
            <div>
              <div class="title-text">Venue AI Booking Assistant</div>
              <div class="subtitle-text">Request a room using plain English or Hinglish. Checks availability with underlying timetable constraints.</div>
            </div>
          </div>

          <div style="font-size: 11px; font-weight: 700; color: var(--gold-dark); margin-bottom: 6px;" class="mono">SAMPLE BENCHMARK REQUESTS:</div>
          <div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px;">
            <button onclick="fillAI('seminar hall kal shaam 6 baje, 2 ghante, 100 log, mic chahiye')" style="background: var(--yellow-light); border: 1px solid var(--border); padding: 8px 12px; border-radius: 5px; text-align: left; font-size: 11px; font-weight: 600; color: var(--primary); cursor: pointer;">
              "seminar hall kal shaam 6 baje, 2 ghante, 100 log, mic chahiye"
            </button>
            <button onclick="fillAI('Need a room for 45 people on Tuesday 6 to 8 pm, projector please.')" style="background: var(--yellow-light); border: 1px solid var(--border); padding: 8px 12px; border-radius: 5px; text-align: left; font-size: 11px; font-weight: 600; color: var(--primary); cursor: pointer;">
              "Need a room for 45 people on Tuesday 6 to 8 pm, projector please."
            </button>
          </div>

          <div style="display: flex; gap: 8px; margin-bottom: 16px;">
            <input type="text" id="ai-user-input" class="form-input" placeholder="Type booking request in English or Hinglish..." />
            <button onclick="submitUserAI()" style="background: var(--primary); color: #fff; border: none; padding: 8px 16px; border-radius: 4px; font-weight: 600; cursor: pointer; white-space: nowrap;">
              Check Availability
            </button>
          </div>

          <div id="ai-user-result" style="display: none;"></div>
        </div>
      `;
    }

    function fillAI(txt) {
      document.getElementById("ai-user-input").value = txt;
      submitUserAI();
    }

    async function submitUserAI() {
      const val = document.getElementById("ai-user-input").value;
      if (!val) return;
      const resContainer = document.getElementById("ai-user-result");
      resContainer.style.display = "block";
      resContainer.innerHTML = "<div style='color: var(--primary); font-size: 12px;'>Analyzing request...</div>";

      try {
        const res = await fetch("/api/parse-nlp", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: val })
        }).then(r => r.json());

        resContainer.innerHTML = `
          <div style="background: var(--yellow-light); border: 1px solid var(--yellow-border); border-radius: 6px; padding: 16px;">
            <div style="font-weight: 700; color: var(--primary); margin-bottom: 10px;">Extracted & Clash-Checked Request</div>
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; font-size: 11px; margin-bottom: 12px;" class="mono">
              <div style="background: #ffffff; padding: 8px; border: 1px solid var(--border); border-radius: 4px;">
                <div style="color: var(--text-muted); font-size: 10px;">SEATING</div>
                <strong>${res.attendance} pax</strong>
              </div>
              <div style="background: #ffffff; padding: 8px; border: 1px solid var(--border); border-radius: 4px;">
                <div style="color: var(--text-muted); font-size: 10px;">DURATION</div>
                <strong>${res.duration_periods} hrs</strong>
              </div>
              <div style="background: #ffffff; padding: 8px; border: 1px solid var(--border); border-radius: 4px;">
                <div style="color: var(--text-muted); font-size: 10px;">SLOT</div>
                <strong style="color: var(--primary);">${res.windows[0].day} P${res.windows[0].from_period}-P${res.windows[0].to_period}</strong>
              </div>
              <div style="background: #ffffff; padding: 8px; border: 1px solid var(--border); border-radius: 4px;">
                <div style="color: var(--text-muted); font-size: 10px;">NEEDS</div>
                <strong>${res.needs.length ? res.needs.join(', ') : 'None'}</strong>
              </div>
            </div>
            <div style="display: flex; justify-content: flex-end;">
              <button onclick="showToast('Venue request submitted for review!')" style="background: var(--primary); color: #fff; border: none; padding: 7px 16px; border-radius: 4px; font-weight: 600; cursor: pointer;">
                Submit Venue Request
              </button>
            </div>
          </div>
        `;
      } catch (e) {
        resContainer.innerHTML = "<div style='color:red;'>Parser error</div>";
      }
    }

    // 4. MIDSEM EXAMS
    function renderExams(content) {
      content.innerHTML = `
        <div class="content-card">
          <div class="card-title-row">
            <div>
              <div class="title-text">Midsem Examination Schedule</div>
              <div class="subtitle-text">Mon–Sat AM (09:30–11:30) & PM (14:00–16:00). Halved seating capacities per CIT guidelines.</div>
            </div>
          </div>

          <table class="calendar-table" style="font-size: 12px;">
            <thead>
              <tr style="background: var(--yellow-light);">
                <th style="width: 80px;">EXAM ID</th>
                <th>COURSE</th>
                <th>GROUPS</th>
                <th>SEATS</th>
                <th>SLOT</th>
                <th>ALLOCATED VENUES</th>
              </tr>
            </thead>
            <tbody>
              ${SCHED.exams.map(e => {
                const ex = DATA.exams.find(item => item.id === e.exam_id);
                return `
                  <tr>
                    <td class="mono" style="font-weight: 700; text-align: center;">${e.exam_id}</td>
                    <td style="font-weight: 600;">${ex ? ex.course_ids.join(', ') : ''}</td>
                    <td class="mono" style="font-size: 11px;">${ex ? ex.groups.join(', ') : ''}</td>
                    <td class="mono" style="text-align: center;">${ex ? ex.size : 0}</td>
                    <td class="mono" style="font-weight: 700; text-align: center;">${e.day} ${e.session}</td>
                    <td class="mono" style="font-weight: 700; color: var(--green);">${e.rooms.join(' + ')}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
